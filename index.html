<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna Escolar</title>

<style>
body{
 font-family:Arial,sans-serif;
 margin:20px;
 background:#f5f5f5;
}

.tab{
 padding:10px 20px;
 cursor:pointer;
 border:none;
 margin-right:10px;
}

.active{
 background:#2e7d32;
 color:white;
}

.section{
 display:none;
 margin-top:20px;
}

.section.active{
 display:block;
}

button{
 padding:10px;
 margin:4px;
 cursor:pointer;
}

input{
 padding:8px;
 margin:4px;
}

#teclado button{
 width:60px;
 height:60px;
 font-size:20px;
}

#numero{
 font-size:40px;
 margin:20px 0;
}
</style>
</head>
<body>

<h1>Urna Escolar</h1>

<button class="tab active" onclick="abrirAba('mesario')">
Mesário
</button>

<button class="tab" onclick="abrirAba('urna')">
Urna
</button>

<div id="mesario" class="section active">

<h2>Cadastrar candidato</h2>

 <div id="loginMesario">

<input
type="password"
id="senhaMesario"
placeholder="Senha do mesário">

<button onclick="entrarMesario()">
Entrar
</button>

</div>

<div id="painelMesario" style="display:none;">

<h2>Cadastrar candidato</h2>

 <input id="nome" placeholder="Nome">

<input
id="foto"
placeholder="Link da foto">
 
<input id="numeroCand"
maxlength="2"
placeholder="Número">

<button onclick="cadastrarCandidato()">
Adicionar
</button>

<hr>

<h2>Candidatos</h2>
<div id="listaCandidatos"></div>

<hr>

<button onclick="liberarVoto()">
Liberar eleitor
</button>

<button onclick="encerrarEleicao()">
Encerrar eleição
</button>
<button onclick="novaEleicao()">
Nova eleição
</button>

<h2>Resultado</h2>

<div id="resultado"></div>

</div>

</div>

<div id="urna" class="section">

<h2>Urna</h2>

<div id="status">
Aguardando liberação...
</div>

<div id="numero">--</div>

<div id="candidato"></div>

<div id="teclado"></div>

<button onclick="corrige()">
CORRIGE
</button>

<button onclick="branco()">
BRANCO
</button>

<button onclick="confirma()">
CONFIRMA
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
setDoc,
updateDoc,
deleteDoc,
getDocs,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyByG67GkhFc0GU0sPjIBvM7sSH2ullBucQ",
authDomain: "urna-escolar-rener.firebaseapp.com",
projectId: "urna-escolar-rener",
storageBucket: "urna-escolar-rener.firebasestorage.app",
messagingSenderId: "346784616263",
appId: "1:346784616263:web:e2fc42d94a843c19aa0662"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let numeroDigitado="";
let votoBranco=false;
let statusAtual="idle";
let candidatos=[];

 const SENHA_MESARIO = "rener";

window.entrarMesario = function(){

  const senha =
  document.getElementById(
    "senhaMesario"
  ).value;

  if(senha !== SENHA_MESARIO){

    alert("Senha incorreta.");

    return;
  }

  document.getElementById(
    "loginMesario"
  ).style.display = "none";

  document.getElementById(
    "painelMesario"
  ).style.display = "block";

}

window.abrirAba = function(nome){

document.querySelectorAll(".section")
.forEach(el=>el.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(el=>el.classList.remove("active"));

document.getElementById(nome)
.classList.add("active");

event.target.classList.add("active");
}

window.cadastrarCandidato = async function(){

  const nome =
  document.getElementById("nome").value;

  const foto =
document.getElementById("foto").value;
 
 const numero =
  document.getElementById("numeroCand").value;

  if(!nome || numero.length!==2){
    alert("Informe nome e número.");
    return;
  }
const existente =
candidatos.find(
  c => c.numero === numero
);

if(existente){
  alert(
    "Já existe um candidato com esse número."
  );
  return;
}
  await addDoc(
    collection(db,"candidatos"),
    {
     nome,
    numero,
    foto
    }
  );

document.getElementById("nome").value="";
document.getElementById("foto").value="";
document.getElementById("numeroCand").value="";
}

window.excluirCandidato =
async function(id){

  if(!confirm("Excluir candidato?")){
    return;
  }

  await deleteDoc(
    doc(db,"candidatos",id)
  );

}

window.liberarVoto = async function(){

  await setDoc(
    doc(db,"controle","estado"),
    {
      status:"ready"
    }
  );

}

window.encerrarEleicao = async function(){

  await setDoc(
    doc(db,"controle","estado"),
    {
      status:"closed"
    }
  );

  alert(
    "Eleição encerrada. Resultado disponível abaixo."
  );

}
window.novaEleicao = async function(){

  if(
    !confirm(
      "Apagar todos os votos e iniciar uma nova eleição?"
    )
  ){
    return;
  }

  const votos =
    await getDocs(
      collection(db,"votos")
    );

  for(const voto of votos.docs){

    await deleteDoc(
      voto.ref
    );

  }

  await setDoc(
    doc(db,"controle","estado"),
    {
      status:"idle"
    }
  );

  document.getElementById(
    "resultado"
  ).innerHTML = "";

  alert(
    "Nova eleição iniciada."
  );

}

function atualizarUrna(){

document.getElementById("numero")
.textContent =
numeroDigitado || "--";

const candidato =
candidatos.find(
c=>c.numero===numeroDigitado
);

document.getElementById(
"candidato"
).innerHTML =
candidato
? `
src="${candidato.foto}"
style="
width:120px;
height:120px;
object-fit:cover;
border-radius:8px;
">
<br><br>

${candidato.nome}
`
: (
numeroDigitado.length===2
? "Voto nulo"
: ""
);

}

function criarTeclado(){

const teclado =
document.getElementById("teclado");

for(let i=1;i<=9;i++){

const btn=document.createElement("button");

btn.textContent=i;

btn.onclick=()=>{

if(statusAtual!=="ready") return;

if(numeroDigitado.length<2){

numeroDigitado+=i;

atualizarUrna();

}

};

teclado.appendChild(btn);

}

const zero=document.createElement("button");

zero.textContent="0";

zero.onclick=()=>{

if(statusAtual!=="ready") return;

if(numeroDigitado.length<2){

numeroDigitado+="0";

atualizarUrna();

}

};

teclado.appendChild(zero);

}

window.corrige = function(){

numeroDigitado="";
votoBranco=false;

atualizarUrna();
}

window.branco = function(){

if(statusAtual!=="ready")
return;

votoBranco=true;

numeroDigitado="";

document.getElementById(
"candidato"
).textContent="Voto em branco";
}

window.confirma = async function(){

if(statusAtual!=="ready")
return;

if(
!votoBranco &&
numeroDigitado.length!==2
){
return;
}

await addDoc(
collection(db,"votos"),
{
numero:
votoBranco
? "BRANCO"
: numeroDigitado,
data:new Date().toISOString()
}
);

await updateDoc(
doc(db,"controle","estado"),
{
status:"idle"
}
);

numeroDigitado="";
votoBranco=false;

atualizarUrna();
}

onSnapshot(
collection(db,"candidatos"),
snapshot=>{

candidatos=[];

const div =
document.getElementById(
"listaCandidatos"
);

div.innerHTML="";

snapshot.forEach(docSnap=>{

const c=docSnap.data();

candidatos.push(c);

div.innerHTML += `
<div>
  ${c.numero} - ${c.nome}
  <button onclick="excluirCandidato('${docSnap.id}')">
    Excluir
  </button>
</div>
`;

});

}
);

onSnapshot(
doc(db,"controle","estado"),
snap=>{

const dados=snap.data();

if(!dados) return;

statusAtual=dados.status;

document.getElementById(
"status"
).textContent=
statusAtual==="ready"
? "Digite seu voto"
: statusAtual==="closed"
? "Eleição encerrada"
: "Aguardando liberação";

}
);

onSnapshot(
collection(db,"votos"),
snapshot=>{

const contagem={};

snapshot.forEach(doc=>{

const voto=
doc.data().numero;

contagem[voto]=
(contagem[voto]||0)+1;

});

let html="";

const total =
Object.values(contagem)
.reduce((a,b)=>a+b,0);

let vencedor = "";
let max = 0;

for(const numero in contagem){

  if(contagem[numero] > max){
    max = contagem[numero];
    vencedor = numero;
  }

}

html += `
<h3>🏆 RESULTADO FINAL</h3>
<hr>
`;

for(const k in contagem){

  const candidato =
  candidatos.find(
    c => c.numero === k
  );

  const nome =
  candidato
    ? candidato.nome
    : (k === "BRANCO"
      ? "Brancos"
      : k);

  const percentual =
  (
    contagem[k] * 100 / total
  ).toFixed(1);

  const trofeu =
  k === vencedor
    ? " 🏆"
    : "";

html += `
<div style="
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
background:white;
color:black;
">

<strong style="font-size:18px;color:black;">
${nome}${trofeu}
</strong>

<br>

${contagem[k]} voto(s)

<br>

${percentual}%

</div>
`;
}
html += `
<hr>
<strong>
Total de votos: ${total}
</strong>
`;

document.getElementById(
"resultado"
).innerHTML = html;

}
);

criarTeclado();

</script>

</body>
</html>
